name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - run: opam install . --deps-only --with-test -y
      - run: opam install ocamlformat.0.29.0 -y
      - run: opam exec -- dune build
      - run: opam exec -- dune build @fmt
      - run: opam exec -- dune runtest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c scripts/requirements.txt cwltest
      # On a PR, compare against ccr built from the base branch: a test that
      # passes there must still pass. On a push to main, just report.
      - name: v1.2 conformance
        run: opam exec -- python scripts/conformance.py --suite v1.2 ${BASE:+--baseline origin/$BASE}
        env:
          BASE: ${{ github.base_ref }}
      - name: oracle authorities
        run: python scripts/oracle.py --check
      - name: oracle suite
        run: opam exec -- python scripts/conformance.py --suite oracle ${BASE:+--baseline origin/$BASE}
        env:
          BASE: ${{ github.base_ref }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance
          path: _build/conformance/

  # Size and shape (AGENTS.md). Its own job, so it is its own required check.
  # The script and gates.json come from the base branch, so a PR that edits
  # them is measured by the old ones, and .github/CODEOWNERS makes the owner
  # read any change to them or to this file. It checks the PR's own commits,
  # up to the PR head, not GitHub's merge commit.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - run: opam install . --deps-only --with-test -y
      - run: opam install ocamlformat.0.29.0 -y
      - name: gate tests
        run: python3 -m unittest scripts/test_gates.py
      - name: take the gate from the base branch
        run: |
          if [ -n "$BASE" ] && git show "origin/$BASE:scripts/gates.py" > "$RUNNER_TEMP/gates.py" 2> /dev/null; then :
          else cp scripts/gates.py "$RUNNER_TEMP/gates.py"; fi
      - name: every commit
        if: github.event_name == 'pull_request'
        run: opam exec -- python3 "$RUNNER_TEMP/gates.py" --base "origin/$BASE" --head "$HEAD"
      - name: every commit builds, keeps its test cases, and has tests that need it
        if: github.event_name == 'pull_request'
        run: opam exec -- python3 "$RUNNER_TEMP/gates.py" --each --base "origin/$BASE" --head "$HEAD"
      - name: mutants
        run: opam exec -- python3 "$RUNNER_TEMP/gates.py" --mutants
