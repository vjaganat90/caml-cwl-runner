# Each case names the authority for its expected output. A ccr:spec case
# quotes the vendored spec sentences that pin it; scripts/oracle.py checks
# cwltool against it and never rewrites it. A ccr:unspecified case covers
# behavior the spec leaves open; its output is recorded from the cwltool
# pinned in scripts/requirements.txt.
$namespaces:
  ccr: https://github.com/vjaganat90/caml-cwl-runner#
$graph:
- id: stdout_capture_control
  doc: Control case ccr already passes, so a harness break shows up as a regression.
  ccr:spec: vendor/cwl-v1.2/CommandLineTool.yml
  ccr:quote: >-
    Capture the command's standard output stream to a file written to the
    designated output directory.
  tool: stdout-capture.cwl
  job: stdout-capture.json
  tags:
  - command_line_tool
  - oracle
  output:
    out:
      basename: out.txt
      class: File
      checksum: sha1$f572d396fae9206628714fb2ce00f72e94f2258f
      size: 6
      location: out.txt
